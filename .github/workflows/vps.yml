name: 🖥️ Free GitHub Windows VPS - Native GUI + Tailscale

on:
  workflow_dispatch:
    inputs:
      session_hours:
        description: '⏱️ Session Duration (hours)'
        required: true
        default: '6'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - '6'

jobs:
  vps:
    runs-on: windows-latest
    timeout-minutes: 359

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Configure Windows VPS & Install Chrome
        shell: pwsh
        run: |
          $pass = "${{ secrets.VPS_PASSWORD || 'luffy@123' }}"
          .\setup.ps1 -Password $pass

      - name: Run verification
        shell: pwsh
        run: .\verify.ps1

      - name: Display connection information
        shell: pwsh
        run: |
          $tsIp = (tailscale ip -4).Trim()
          $pass = "${{ secrets.VPS_PASSWORD || 'luffy@123' }}"
          Write-Host ""
          Write-Host "=================================================="
          Write-Host "🟢 WINDOWS VPS IS READY (NATIVE GUI)"
          Write-Host "=================================================="
          Write-Host "  Tailscale IP : $tsIp"
          Write-Host "  Username     : luffy"
          Write-Host "  Password     : $pass"
          Write-Host "  Port         : 3389"
          Write-Host ""
          Write-Host "  Connect via Windows Remote Desktop (mstsc) :"
          Write-Host "    Computer : $tsIp"
          Write-Host "    Username : luffy"
          Write-Host "=================================================="
          Write-Host ""

      - name: Keep VPS Alive
        shell: pwsh
        run: |
          Write-Host "Windows VPS is running. Session active for up to 6 hours."
          Start-Sleep -Seconds 21500
